server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    # SAFE defaults: do not leak internals by default
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

spring:
  application:
    name: momsbud-backend

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  otp:
    pepper: ${OTP_PEPPER:}
    length: 6
    ttl-seconds: 300     # 5 min
    max-attempts: 5
    send-rate:
      per-ip-per-min: 5
      per-phone-per-hour: 6

  sms:
    # Align with your env naming (you use APP_SMS_PROVIDER in .env)
    provider: ${APP_SMS_PROVIDER:log}  # Options: log, twilio

    log:
      enabled: true
      message-template: "Your OTP code is: {code}. It expires in {ttl} minutes."

    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      message-template: "Your OTP code is: {code}. It expires in {ttl} minutes."

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:momsbud}
      ttl-minutes: ${JWT_TTL_MINUTES:1440}

    revocation:
      enabled: true
