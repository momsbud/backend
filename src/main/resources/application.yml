server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always

spring:
  application:
    name: momsbud-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:momsbud}
    username: ${POSTGRES_USER:momsbud}
    password: ${POSTGRES_PASSWORD:momsbud}
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


app:
  otp:
    pepper: ${OTP_PEPPER:}
    length: 6
    ttl-seconds: 300     # 5 min
    max-attempts: 5
    send-rate:
      per-ip-per-min: 5
      per-phone-per-hour: 6
      
  sms:
    provider: ${SMS_PROVIDER:log}  # Options: log, twilio
    
    # Log provider config (for development)
    log:
      enabled: true
      message-template: "Your OTP code is: {code}. It expires in {ttl} minutes."
    
    # Twilio provider config
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      message-template: "Your OTP code is: {code}. It expires in {ttl} minutes."

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:momsbud}
      ttl-minutes: ${JWT_TTL_MINUTES:1440}

    revocation:
      enabled: true
