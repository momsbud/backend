spring:
  datasource:
    url: jdbc:postgresql://[::1]:5432/momsbud
    username: momsbud
    password: momsbud
  redis:
    host: 127.0.0.1
    port: 6379

app:
  otp:
    length: 6
    ttl-seconds: 300
    max-attempts: 5
    send-rate:
      per-ip-per-min: 30
      per-phone-per-hour: 60
    pepper: ${OTP_PEPPER:dev-pepper-123}  # good default for local

  security:
    jwt:
      secret: ${JWT_SECRET}               # reuse your strong base64 secret
      issuer: ${JWT_ISSUER:momsbud}
      ttl-minutes: ${JWT_TTL_MINUTES:1440}

  sms:
    provider: ${APP_SMS_PROVIDER:log}
    log:
      to-stdout: true
      mask: false
momsbud:
  dev:
    endpoints:
      enabled: true