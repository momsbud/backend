server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/momsbud}
    username: ${SPRING_DATASOURCE_USERNAME:momsbud}
    password: ${SPRING_DATASOURCE_PASSWORD:momsbud}

  redis:
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  otp:
    pepper: ${OTP_PEPPER:dev-pepper-123}
    length: 6
    ttl-seconds: 300
    max-attempts: 5
    send-rate:
      per-ip-per-min: 30
      per-phone-per-hour: 60

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:momsbud}
      ttl-minutes: ${JWT_TTL_MINUTES:1440}

  sms:
    provider: ${APP_SMS_PROVIDER:log}
    log:
      to-stdout: true
      mask: false

momsbud:
  dev:
    endpoints:
      enabled: true
